[project]
name = "maibot-telegram-adapter"
version = "0.1.13"
description = "Telegram Bot API message gateway for MaiBot"
authors = [{name = "MaiBot Team"}]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3,<4",
    "httpx[socks]>=0.28,<1",
    "imageio-ffmpeg>=0.6,<1",
    "maibot-plugin-sdk>=2.10,<3",
    "pillow>=12.3",
    "rlottie-python>=1.3.7,<2",
]

[project.urls]
Repository = "https://github.com/Mai-with-u/Maibot-telegram-adaptor"
Homepage = "https://github.com/Mai-with-u/Maibot-telegram-adaptor"
Documentation = "https://github.com/Mai-with-u/Maibot-telegram-adaptor/blob/main/README.md"
Issues = "https://github.com/Mai-with-u/Maibot-telegram-adaptor/issues"

[dependency-groups]
dev = ["ruff>=0.12"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
