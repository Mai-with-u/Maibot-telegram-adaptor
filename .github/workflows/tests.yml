name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.15"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run --locked ruff check .
      - run: uv run --locked python -m unittest discover -s tests -v
      - name: Import plugin with locked SDK
        run: uv run --locked python -c "import importlib, sys; from pathlib import Path; root = Path.cwd(); sys.path.insert(0, str(root.parent)); importlib.import_module(root.name + '.plugin')"
